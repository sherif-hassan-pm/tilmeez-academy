async function aiAsk(prompt){for(let i=0;i<2;i++){try{const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"system",content:"You are an expert teacher assistant for a children tutoring academy. Reply with valid JSON only, no markdown fences. Write in "+(L=="ar"?"Arabic":"English")+" unless the subject is English language practice."},{role:"user",content:prompt}]})});const j=await r.json();let c=j.choices[0].message.content.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();return JSON.parse(c)}catch(e){console.error(e)}}throw new Error(t("aiFail"))}
async function aiGen(k){const o=val(k+"o").trim();if(!o)return alert(t("aiNeed"));const b=document.getElementById(k+"gb"),pv=document.getElementById(k+"pv");b.disabled=true;b.textContent=t("aiBusy");GEN=null;
 try{const sj=val(k=="a"?"as":"ms"),g=val(k+"g");const ctx=`Subject: ${sj}. Level: ${g||"primary school"}. Objectives: ${o}.`;
  if(k=="m"){const r=await aiAsk(ctx+' Write clear, friendly lesson notes with a short explanation, key points and 2 examples. JSON: {"title":"","notes":""}');document.getElementById("mt").value=r.title||"";document.getElementById("mc").value=r.notes||"";pv.textContent=t("aiReady")}
  else{const ty=val("at2"),n=Math.min(15,Math.max(3,+val("ac")||5));
   if(ty=="written"){const r=await aiAsk(ctx+' Create an attractive written assignment with a fun title and clear instructions. JSON: {"title":"","description":""}');document.getElementById("at").value=r.title||"";document.getElementById("ad0").value=r.description||"";pv.textContent=t("aiReady")}
   else{const r=await aiAsk(ctx+` Create an engaging ${ty=="contest"?"contest":"quiz"} with ${n} multiple choice questions, 4 options each, exactly one correct. "answer" is the 0-based index of the correct option. JSON: {"title":"","description":"","questions":[{"q":"","options":["","","",""],"answer":0}]}`);
    const qs=(r.questions||[]).filter(x=>x.q&&Array.isArray(x.options)&&x.options.length>=2&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<x.options.length);if(!qs.length)throw new Error(t("aiFail"));
    GEN={kind:ty,quiz:qs.map(x=>({q:x.q,options:x.options})),key:qs.map(x=>x.answer)};document.getElementById("at").value=r.title||"";document.getElementById("ad0").value=r.description||"";
    pv.innerHTML=`<p>${t("aiReady")}</p>`+qs.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.q)}</b>${x.options.map((op,j)=>`<div>${j==x.answer?"✅":"▫️"} ${esc(op)}</div>`).join("")}</div>`).join("")}}
 }catch(e){alert(e.message||t("aiFail"))}b.disabled=false;b.textContent=t("aiGo")}

 `<div class="card"><h3>${t("newUser")}</h3><select id="tr" onchange="document.getElementById('tsw').style.display=this.value=='teacher'?'':'none'"><option value="student">${t("student")}</option><option value="teacher">${t("teacher")}</option><option value="admin">${t("admin")}</option></select><div id="tsw" style="display:none"><b>${t("pickSubs")}</b>${tsBoxes("tsn")}</div><input id="tn" placeholder="${t("fullname")}"><input id="tu" placeholder="${t("username")}" autocapitalize="none"><input id="tw" type="tel" placeholder="${t("wa")}"><input id="te" type="email" placeholder="${t("em")}"><input id="tp" type="password" placeholder="${t("password")}" autocomplete="new-password"><button class="btn" onclick="addUser()">${t("add")}</button></div>`}
