 return `<div class="card"><h3>${t("book")}</h3>${t("subject")}${subjSel("sj",sj)}${t("teacherL")}${sel("tc",tc)}${t("slot")}<input id="sl" type="datetime-local"><textarea id="nt" placeholder="${t("note")}"></textarea><button class="btn" onclick="addReq()">${t("send")}</button></div>`}
const reqCard=(r,act)=>`<div class="card"><b>${ICON[r.subj]} ${t(r.subj)}</b> ${tag(r.status)}<br><small>${esc(nm(r.s))} / ${esc(nm(r.t))} / ${esc(String(r.slot).replace("T"," "))}</small>${r.note?`<p>${esc(r.note)}</p>`:""}${r.reply?`<p>✉ ${esc(r.reply)}</p>`:""}
${r.status=="approved"&&r.meet_link?`<p><a class="btn sm y" href="${esc(r.meet_link)}" target="_blank" rel="noopener">🎥 ${t("openMeet")}</a></p>`:""}${act&&r.status=="approved"?`<input id="ml${r.id}" placeholder="${t("meet")}" value="${esc(r.meet_link||"")}"><button class="btn sm" onclick="setReq('${r.id}','approved')">${t("saveLink")}</button>`:""}${act&&r.status=="pending"?`<input id="rp${r.id}" placeholder="${t("reply")}"><input id="ml${r.id}" placeholder="${t("meet")}"><button class="btn sm" onclick="setReq('${r.id}','approved')">${t("approve")}</button><button class="btn sm red" onclick="setReq('${r.id}','declined')">${t("decline")}</button>`:""}</div>`;
async function vReqs(act){const r=await q(sb.from("requests").select("*,s:profiles!requests_student_id_fkey(full_name,username),t:profiles!requests_teacher_id_fkey(full_name,username)").order("created_at",{ascending:false}));return r.map(x=>reqCard(x,act)).join("")+empty(r)}
async function vAsg(){const a=await q(sb.from("assignments").select("*,p:profiles!assignments_teacher_id_fkey(full_name,username)").order("created_at",{ascending:false}));
 const subs=await q(sb.from("submissions").select("*,s:profiles!submissions_student_id_fkey(full_name,username)"));const st=ME.role=="student";let h="";
 for(const x of a){const mine=subs.find(y=>y.assignment_id==x.id&&y.student_id==ME.id);
  h+=`<div class="card"><b>${esc(x.title)}</b> <span class="tag">${ICON[x.subj]} ${t(x.subj)}</span><br><small>${t("due")}: ${esc(x.due||"-")} · ${t("maxm")}: ${x.max_marks} · ${esc(nm(x.p))}</small>${x.description?`<p>${esc(x.description)}</p>`:""}${fileBtn(x.file_path)}`;
  if(st){if(!mine)h+=`<textarea id="an${x.id}" placeholder="${t("answer")}"></textarea>${fileIn("sf"+x.id)}<button class="btn sm" onclick="subAns('${x.id}')">${t("submit")}</button>`;
   else if(mine.marks==null)h+=`<p><span class="tag pending">${t("submitted")}</span></p><textarea id="an${x.id}">${esc(mine.answer)}</textarea>${fileBtn(mine.file_path,t("myFile"))}${fileIn("sf"+x.id)}<button class="btn sm alt" onclick="subAns('${x.id}')">${t("submit")}</button>`;
   else h+=`<p><span class="tag approved">${t("graded")}</span></p><div class="mark">${mine.marks} / ${x.max_marks}</div><div class="bar"><i style="width:${Math.round(100*mine.marks/x.max_marks)}%"></i></div>${mine.feedback?`<p>✉ ${esc(mine.feedback)}</p>`:""}<p><small>${esc(mine.answer)}</small></p>${fileBtn(mine.file_path,t("myFile"))}`}
  else{const ss=subs.filter(y=>y.assignment_id==x.id);h+=`<h3>${t("subs")} (${ss.length})</h3>`;
   for(const y of ss)h+=`<div class="card" style="background:#f8fafc"><b>${esc(nm(y.s))}</b>${y.marks!=null?` <span class="pill">${y.marks}/${x.max_marks}</span>`:""}<p>${esc(y.answer)}</p>${fileBtn(y.file_path,t("file"))}<div class="row"><input id="mk${y.id}" type="number" placeholder="${t("mark")} /${x.max_marks}" value="${y.marks==null?"":y.marks}"><input id="fb${y.id}" placeholder="${t("feedback")}" value="${esc(y.feedback||"")}"></div><button class="btn sm" onclick="gradeSub('${y.id}',${x.max_marks})">${t("save")}</button></div>`;
   h+=`<button class="btn sm red" onclick="delAsg('${x.id}')">${t("del")}</button>`}
  h+=`</div>`}
 if(!st)h+=`<div class="card"><h3>${t("add")}</h3>${subjSel("as")}<input id="at" placeholder="${t("title")}"><textarea id="ad0" placeholder="${t("desc")}"></textarea>${fileIn("af")}<div class="row"><input id="ad" type="date"><input id="am" type="number" placeholder="${t("maxm")}" value="100"></div><button class="btn" onclick="addAsg()">${t("add")}</button></div>`;
 return h+empty(a)}
async function vMarks(){const s=await q(sb.from("submissions").select("*,assignments(title,max_marks,subj)").eq("student_id",ME.id).not("marks","is",null).order("graded_at",{ascending:false}));
 return `<h2>${t("marks")}</h2>`+s.map(x=>`<div class="card"><b>${esc(x.assignments.title)}</b> <span class="tag">${ICON[x.assignments.subj]} ${t(x.assignments.subj)}</span><div class="mark">${x.marks} / ${x.assignments.max_marks}</div>${x.feedback?`<p>✉ ${esc(x.feedback)}</p>`:""}</div>`).join("")+empty(s)}
async function vMats(){const m=await q(sb.from("materials").select("*").order("created_at",{ascending:false}));
 return m.map(x=>`<div class="card"><b>${esc(x.title)}</b> <span class="tag">${ICON[x.subj]} ${t(x.subj)}</span><br>${/^https?:/.test(x.link||"")?`<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.link)}</a>`:esc(x.link||"")}<br>${fileBtn(x.file_path)}</div>`).join("")+empty(m)+
 (ME.role!="student"?`<div class="card"><h3>${t("add")}</h3>${subjSel("ms")}<input id="mt" placeholder="${t("title")}"><input id="ml" placeholder="${t("link")}">${fileIn("mf")}<button class="btn" onclick="addMat()">${t("add")}</button></div>`:"")}
async function vAtt(){const a=await q(sb.from("attendance").select("*,s:profiles!attendance_student_id_fkey(full_name,username)").order("day",{ascending:false}).limit(50));let h="";
 if(ME.role=="teacher"){const ss=await q(sb.from("profiles").select("id,full_name,username").eq("role","student"));h=ss.map(s=>`<div class="card"><b>${esc(nm(s))}</b><br><button class="btn sm" onclick="markAtt('${s.id}','present')">${t("present")}</button><button class="btn sm red" onclick="markAtt('${s.id}','absent')">${t("absent")}</button></div>`).join("")}
 return h+a.map(x=>`<div class="card">${x.day} ${ME.role!="student"?esc(nm(x.s)):""} ${tag(x.status)}</div>`).join("")+(h?"":empty(a))}
async function vUsers(){const p=await q(sb.from("profiles").select("*").order("created_at"));
 return p.map(x=>`<div class="card">${x.role=="teacher"?"👤":x.role=="admin"?"🛡️":"🎓"} <b>${esc(nm(x))}</b> <small>@${esc(x.username)}</small> <span class="tag">${t(x.role)}</span></div>`).join("")+
 `<div class="card"><h3>${t("newUser")}</h3><select id="tr"><option value="student">${t("student")}</option><option value="teacher">${t("teacher")}</option></select><input id="tn" placeholder="${t("fullname")}"><input id="tu" placeholder="${t("username")}" autocapitalize="none"><input id="tp" type="password" placeholder="${t("password")}" autocomplete="new-password"><button class="btn" onclick="addUser()">${t("add")}</button></div>`}
const PUB=[["home","🏠"],["subjects","📚"],["news","📢"],["account","👤"]];
const TABS={student:[["home","🏠"],["subjects","📚"],["book","➕"],["mine","📅"],["asg","📝"],["marks","🏅"]],teacher:[["home","🏠"],["reqs","📥"],["asg","📝"],["mats","📎"],["att","✅"]],admin:[["home","🏠"],["reqs","📥"],["users","🎓"],["news","📢"],["att","✅"]]};
async function view(){switch(tab){case"home":return vHome();case"subjects":return vSubjects();case"news":return vNews();case"account":return ME?vHome():vAccount();
 case"book":return vBook();case"mine":case"reqs":return vReqs(tab=="reqs");case"asg":return vAsg();case"marks":return vMarks();case"mats":return vMats();case"att":return vAtt();case"users":return vUsers()}return""}
let rn=0;
async function render(){const my=++rn;document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.getElementById("title").textContent=t("app");
 const o=document.getElementById("out");o.textContent=ME?t("logout"):t("login");o.onclick=ME?logout:()=>{mode="login";go("account")};
 if(!ME&&!["home","subjects","news","account"].includes(tab))tab="home";
 const tabs=ME?TABS[ME.role]:PUB;document.getElementById("nav").innerHTML=tabs.map(([k,i])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')"><span>${i}</span>${t(k)}</button>`).join("");
 let h;try{h=await view()}catch(e){console.error(e);h=`<p class="err">${esc(e.message)}</p>`}
 if(my!=rn)return;document.getElementById("app").innerHTML=h}
(async()=>{await loadMe();render()})();
</script></body></html>
